# ─────────────────────────────────────────────────────────────────
# Darvas Scan – shared settings
# Edit here; no Python knowledge required.
# Both darvas_screener.py and darvas_scan.py read this file
# and fall back to their built-in defaults if it is missing.
# ─────────────────────────────────────────────────────────────────

[screener]
# Minimum last close price (USD)
min_price           = 5.0

# Minimum market cap (USD)
min_market_cap      = 500000000

# Minimum 30-day average daily volume
min_avg_vol_30d     = 1000000

# Minimum 14-day average daily range (%)
min_adr_pct         = 2.0

# EMA trend filter: EMA(fast) must be above EMA(slow)
ema_fast            = 50
ema_slow            = 200

# RSI(14) band – stocks outside this range are excluded
rsi_low             = 45
rsi_high            = 75

# Maximum % below the 52-week high based on current price (loose pre-filter;
# the tight ceiling-based check is applied in the scanner via ceil_max_dist_pct)
ath_max_dist_pct    = 10.0

# OHLC history to download per ticker
history_period      = 1y

# Tickers per yfinance bulk call
fetch_chunk_size    = 100

# Seconds between bulk-download chunks
inter_chunk_delay   = 0.5


[scanner]
# Maximum box height as % of the ceiling price: (ceil − floor) / ceil × 100
# Must match "Max box height %" in the TradingView indicator
max_height_pct      = 5.0

# Maximum % the Darvas ceiling may sit below the 52-week high.
# Measured as (52W_high − ceil) / 52W_high × 100.
# This is the correct Darvas proximity check: the ceiling is the breakout level,
# so it — not the current price — should be near the all-time high.
# Set to 100 (or remove) to disable.
ceil_max_dist_pct   = 3.0

# Seed the floor search with the Phase 0 lowest low
# Must match "Seed floor with Phase 0 low" in the indicator (true/false)
seed_floor          = true

# EMA trend filter periods – must match indicator "EMA short/long length"
ema_short           = 20
ema_long            = 50

# OHLC history to download per ticker
history_period      = 1y

# Tickers per yfinance bulk call
fetch_chunk_size    = 50

# Retry count and delay for failed bulk chunks
fetch_retries       = 2
fetch_retry_delay   = 2.0


[lc_scanner]
# Minimum bars before a forming pivot line goes solid (active).
# A line younger than this is ignored — it has not had time to prove itself
# as meaningful resistance. Must match minBarsLC in the Pine Script indicator.
# History: raised 5 → 10 on 2026-05-31 to eliminate the flood of 5–7-bar-old
# lines that made up ~66% of candidates without meaningful consolidation.
min_bars_lc         = 10

lookback_lc         = 200
bars_back           = 300
left_bars           = 2
right_bars          = 2
allow_equal_highs   = true
replace_active_line = false
replace_only_higher = false
pivot_src           = high

# Maximum % the LC pivot price may sit below the 52-week high.
# Measured as (52W_high − pivot_price) / 52W_high × 100.
# The pivot is the breakout level, so proximity is measured from it — not from
# the current price, which sits below. Set to 100 to disable.
# History: tightened 5.0 → 3.0 on 2026-05-31 to match Darvas ceil_max_dist_pct
# and keep only pivots pressing against the true ATH/52W high.
pivot_max_dist_pct  = 1.0

# Maximum % the current close may sit below the pivot (breakout level).
# Measured as (pivot_price − current_close) / pivot_price × 100.
# Filters out stocks that are too far from breaking out. Set to 100 to disable.
max_price_dist_pct  = 2.0

history_period      = 1y
fetch_chunk_size    = 50


[lw_low_scanner]
# Band around last week's low, in percent. A ticker qualifies when its latest
# close is within this many percent ABOVE OR BELOW last week's low.
# Start loose (5.0) and tighten after live testing.
proximity_pct       = 0.5

fetch_chunk_size    = 50
